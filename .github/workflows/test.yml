name: test

on:
  push:
    branches: [main, public-release]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # glassEffect macOS 26 SDK ister. Bu imajda Xcode 26 var.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift sürümü
        run: swift --version
      - name: Testler
        run: swift test
